name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Byte-compile all plugins
        run: python -m compileall -q plugins

      # Agent plugins are shipped twice: in the plugin family's agents/ folder (2.5 GUI download,
      # future bakery v2) and below local/share/check_mk/agents/ (bakery v1).
      - name: Agent plugin copies are identical
        run: |
          rc=0
          for f in plugins/*/local/lib/python3/cmk_addons/plugins/*/agents/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            plugin_root=${f%%/local/*}
            other=$(find "$plugin_root/local/share/check_mk/agents" -name "$name" 2>/dev/null | head -1)
            if [ -n "$other" ] && ! cmp -s "$f" "$other"; then
              echo "::error file=$f::differs from $other"; rc=1
            fi
          done
          exit $rc
